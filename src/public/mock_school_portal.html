<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School ERP Portal Simulation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: #1e293b; padding: 1rem 2rem; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; flex: 1; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 2rem; }
    .btn { background: #2563eb; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .suspended-banner { background: #7f1d1d; border: 1px solid #ef4444; border-radius: 8px; padding: 2.5rem; text-align: center; }
    .badge-suspended { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; padding: 0.2rem 0.6rem; border-radius: 9999px; font-weight: 700; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="header">
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <i class="fa-solid fa-graduation-cap" style="color: #3b82f6; font-size: 1.5rem;"></i>
      <div>
        <div style="font-weight: 700; font-size: 1.1rem;" id="school-name">School ERP Portal</div>
        <div style="font-size: 0.75rem; color: #94a3b8;" id="school-status-text">Connected to Central ERP Command</div>
      </div>
    </div>
    <div id="status-pill">
      <!-- Injected -->
    </div>
  </div>

  <div class="container" id="portal-content">
    <!-- Active or Suspended view will render here -->
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const schoolId = params.get('school_id') || 'sch-delhi-03';

    async function checkStatus() {
      try {
        const res = await fetch('/api/v1/schools/' + schoolId, {
          headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('central_token') || '') }
        });
        const data = await res.json();
        const school = data.data.school;

        document.getElementById('school-name').textContent = school.name;

        if (school.status === 'SUSPENDED') {
          renderSuspended(school);
        } else {
          renderActive(school);
        }
      } catch (e) {
        document.getElementById('portal-content').innerHTML = '<div class="card">Loading school status...</div>';
      }
    }

    function renderSuspended(school) {
      document.getElementById('status-pill').innerHTML = '<span class="badge-suspended"><i class="fa-solid fa-ban"></i> SERVICE SUSPENDED</span>';
      document.getElementById('portal-content').innerHTML = `
        <div class="suspended-banner">
          <i class="fa-solid fa-lock" style="font-size: 3.5rem; color: #f87171; margin-bottom: 1rem;"></i>
          <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">School ERP Service Suspended</h1>
          <p style="color: #cbd5e1; max-width: 600px; margin: 0 auto 1.5rem auto; font-size: 0.95rem;">
            ${school.suspension_reason || 'The subscription for this school ERP installation has lapsed. User access has been temporarily placed on administrative hold.'}
          </p>

          <div style="background: rgba(0,0,0,0.3); border: 1px dashed #ef4444; border-radius: 6px; padding: 1.25rem; max-width: 550px; margin: 0 auto 1.5rem auto; text-align: left; font-size: 0.85rem;">
            <div style="color: #fca5a5; font-weight: 700; margin-bottom: 0.35rem;"><i class="fa-solid fa-shield-check"></i> Non-Destructive Data Guarantee</div>
            <div style="color: #e2e8f0; line-height: 1.4;">
              All student records, teacher profiles, examination marks, and attendance registers remain <strong>100% intact, encrypted, and preserved</strong> in your local database. No data has been deleted.
            </div>
          </div>

          <div style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 1rem;">
            For immediate reactivation, please settle pending subscription invoices or contact:
          </div>
          <div style="font-size: 0.95rem; font-weight: 600; color: #60a5fa;">
            billing@centralcommand.io • Central Support: +91 800-ERP-HELP
          </div>
        </div>
      `;
    }

    function renderActive(school) {
      document.getElementById('status-pill').innerHTML = '<span style="background: rgba(16,185,129,0.2); color: #10b981; border: 1px solid #10b981; padding: 0.2rem 0.6rem; border-radius: 9999px; font-weight: 700; font-size: 0.8rem;"><i class="fa-solid fa-circle-check"></i> OPERATIONAL</span>';
      document.getElementById('portal-content').innerHTML = `
        <div class="card">
          <h2 style="margin-top: 0;">Welcome to ${school.name} ERP</h2>
          <p style="color: #94a3b8;">Normal school operations active. Students and teachers can log in without interruption.</p>
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 1.5rem;">
            <div style="background: #0f172a; padding: 1rem; border-radius: 6px;">
              <div style="color: #94a3b8; font-size: 0.75rem;">ADMISSION PORTAL</div>
              <div style="font-size: 1.25rem; font-weight: 700;">Open</div>
            </div>
            <div style="background: #0f172a; padding: 1rem; border-radius: 6px;">
              <div style="color: #94a3b8; font-size: 0.75rem;">ATTENDANCE RECORDING</div>
              <div style="font-size: 1.25rem; font-weight: 700; color: #10b981;">Online</div>
            </div>
            <div style="background: #0f172a; padding: 1rem; border-radius: 6px;">
              <div style="color: #94a3b8; font-size: 0.75rem;">FEE COUNTER</div>
              <div style="font-size: 1.25rem; font-weight: 700; color: #3b82f6;">Active</div>
            </div>
          </div>
        </div>
      `;
    }

    checkStatus();
  </script>
</body>
</html>
